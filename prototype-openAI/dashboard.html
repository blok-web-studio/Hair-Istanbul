<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair Istanbul Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #fff;
      min-height: 100vh;
    }

    .header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.25rem;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .user-info {
      font-size: 0.9rem;
      color: #888;
    }

    .logout-btn {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .container {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    .tab {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 0.95rem;
      border-radius: 6px;
    }

    .tab:hover {
      color: #fff;
    }

    .tab.active {
      background: #007BFF;
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .date-filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .date-filters input {
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    .date-filters button {
      padding: 0.5rem 1rem;
      background: #007BFF;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .date-filters button:hover {
      background: #0056b3;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .stat-card h3 {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 600;
      color: #007BFF;
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .chart-container h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .table-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      color: #888;
      font-weight: 500;
    }

    td {
      font-size: 0.9rem;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pagination button {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .pagination button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .user-form {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .user-form h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 1rem;
    }

    .form-row input {
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    .form-row button {
      padding: 0.5rem 1rem;
      background: #007BFF;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .badge-permanent {
      background: rgba(0, 123, 255, 0.2);
      color: #007BFF;
    }

    .badge-regular {
      background: rgba(255, 255, 255, 0.1);
      color: #888;
    }

    .action-btn {
      padding: 0.35rem 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .action-btn.delete:hover {
      background: rgba(255, 68, 68, 0.2);
      border-color: rgba(255, 68, 68, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #1a1a2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }

    .modal-content h2 {
      margin-bottom: 1rem;
    }

    .modal-content input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .modal-actions button.cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .modal-actions button.save {
      background: #007BFF;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Hair Istanbul Dashboard</h1>
    <div class="header-actions">
      <span class="user-info" id="userInfo"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('analytics')">Analytics</button>
      <button class="tab" onclick="switchTab('bookings')">Bookings</button>
      <button class="tab" onclick="switchTab('users')">Users</button>
    </div>

    <div id="analytics" class="tab-content active">
      <div class="date-filters">
        <input type="date" id="startDate">
        <input type="date" id="endDate">
        <button onclick="loadAnalytics()">Apply Filters</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Visitors</h3>
          <div class="value" id="totalVisitors">0</div>
        </div>
        <div class="stat-card">
          <h3>Unique Visitors</h3>
          <div class="value" id="uniqueVisitors">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Bookings</h3>
          <div class="value" id="totalBookings">0</div>
        </div>
      </div>

      <div class="chart-container">
        <h2>Visitors Over Time</h2>
        <canvas id="visitorsChart"></canvas>
      </div>
    </div>

    <div id="bookings" class="tab-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>City</th>
              <th>Procedure</th>
              <th>Phone</th>
              <th>IP Address</th>
              <th>Location</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="bookingsTable"></tbody>
        </table>
        <div class="pagination">
          <span id="bookingsInfo"></span>
          <div>
            <button onclick="prevBookingsPage()" id="prevBookingsBtn">Previous</button>
            <button onclick="nextBookingsPage()" id="nextBookingsBtn">Next</button>
          </div>
        </div>
      </div>
    </div>

    <div id="users" class="tab-content">
      <div class="user-form">
        <h2>Add New User</h2>
        <div class="form-row">
          <input type="text" id="newUsername" placeholder="Username">
          <input type="password" id="newPassword" placeholder="Password (min 8 chars)">
          <button onclick="addUser()">Add User</button>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Type</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="passwordModal">
    <div class="modal-content">
      <h2>Change Password</h2>
      <input type="password" id="changePasswordInput" placeholder="New password (min 8 chars)">
      <div class="modal-actions">
        <button class="cancel" onclick="closePasswordModal()">Cancel</button>
        <button class="save" onclick="savePassword()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let visitorsChart = null;
    let currentPage = 0;
    const pageSize = 20;
    let totalBookings = 0;
    let editingUserId = null;

    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/check');
        if (!response.ok) {
          window.location.href = window.location.pathname;
          return false;
        }
        const data = await response.json();
        document.getElementById('userInfo').textContent = data.user.username;
        return true;
      } catch (error) {
        window.location.href = window.location.pathname;
        return false;
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = window.location.pathname;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabName).classList.add('active');

      if (tabName === 'analytics') loadAnalytics();
      if (tabName === 'bookings') loadBookings();
      if (tabName === 'users') loadUsers();
    }

    async function loadAnalytics() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let url = '/api/analytics/visitors';
      if (startDate && endDate) {
        url += `?start_date=${startDate}&end_date=${endDate}`;
      }

      try {
        const response = await fetch(url);
        const data = await response.json();

        const totalVisits = data.reduce((sum, d) => sum + d.total_visitors, 0);
        const uniqueVisits = data.reduce((sum, d) => sum + d.unique_visitors, 0);

        document.getElementById('totalVisitors').textContent = totalVisits;
        document.getElementById('uniqueVisitors').textContent = uniqueVisits;

        const totalBookings = await fetch('/api/bookings?limit=1');
        const bookingsData = await totalBookings.json();
        document.getElementById('totalBookings').textContent = bookingsData.total;

        renderChart(data);
      } catch (error) {
        console.error('Failed to load analytics:', error);
      }
    }

    function renderChart(data) {
      const ctx = document.getElementById('visitorsChart').getContext('2d');
      
      if (visitorsChart) {
        visitorsChart.destroy();
      }

      visitorsChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => d.date),
          datasets: [
            {
              label: 'Total Visitors',
              data: data.map(d => d.total_visitors),
              borderColor: '#007BFF',
              backgroundColor: 'rgba(0, 123, 255, 0.1)',
              fill: true,
              tension: 0.4
            },
            {
              label: 'Unique Visitors',
              data: data.map(d => d.unique_visitors),
              borderColor: '#17A2B8',
              backgroundColor: 'rgba(23, 162, 184, 0.1)',
              fill: true,
              tension: 0.4
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: { color: '#fff' }
            }
          },
          scales: {
            x: {
              ticks: { color: '#888' },
              grid: { color: 'rgba(255,255,255,0.05)' }
            },
            y: {
              ticks: { color: '#888' },
              grid: { color: 'rgba(255,255,255,0.05)' }
            }
          }
        }
      });
    }

    async function loadBookings() {
      const offset = currentPage * pageSize;
      
      try {
        const response = await fetch(`/api/bookings?limit=${pageSize}&offset=${offset}`);
        const data = await response.json();
        
        totalBookings = data.total;
        renderBookingsTable(data.bookings);
        updatePagination();
      } catch (error) {
        console.error('Failed to load bookings:', error);
      }
    }

    function renderBookingsTable(bookings) {
      const tbody = document.getElementById('bookingsTable');
      tbody.innerHTML = bookings.map(b => `
        <tr>
          <td>${escapeHtml(b.name)}</td>
          <td>${b.age}</td>
          <td>${escapeHtml(b.city)}</td>
          <td>${escapeHtml(b.procedure)}</td>
          <td>${escapeHtml(b.phone)}</td>
          <td>${escapeHtml(b.ip_address)}</td>
          <td>${b.country ? `${b.country}, ${b.city_location || 'N/A'}` : 'Unknown'}</td>
          <td>${new Date(b.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    function updatePagination() {
      const totalPages = Math.ceil(totalBookings / pageSize);
      document.getElementById('bookingsInfo').textContent = 
        `Showing ${currentPage * pageSize + 1}-${Math.min((currentPage + 1) * pageSize, totalBookings)} of ${totalBookings}`;
      document.getElementById('prevBookingsBtn').disabled = currentPage === 0;
      document.getElementById('nextBookingsBtn').disabled = currentPage >= totalPages - 1;
    }

    function prevBookingsPage() {
      if (currentPage > 0) {
        currentPage--;
        loadBookings();
      }
    }

    function nextBookingsPage() {
      const totalPages = Math.ceil(totalBookings / pageSize);
      if (currentPage < totalPages - 1) {
        currentPage++;
        loadBookings();
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch('/api/users');
        const users = await response.json();
        renderUsersTable(users);
      } catch (error) {
        console.error('Failed to load users:', error);
      }
    }

    function renderUsersTable(users) {
      const tbody = document.getElementById('usersTable');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${escapeHtml(u.username)}</td>
          <td>
            <span class="badge ${u.is_permanent ? 'badge-permanent' : 'badge-regular'}">
              ${u.is_permanent ? 'Permanent' : 'Regular'}
            </span>
          </td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
          <td>
            ${!u.is_permanent ? `
              <button class="action-btn" onclick="openPasswordModal(${u.id})">Change Password</button>
              <button class="action-btn delete" onclick="deleteUser(${u.id})">Delete</button>
            ` : '<span style="color: #888; font-size: 0.8rem;">Locked</span>'}
          </td>
        </tr>
      `).join('');
    }

    async function addUser() {
      const username = document.getElementById('newUsername').value;
      const password = document.getElementById('newPassword').value;

      if (!username || !password) {
        alert('Please fill in all fields');
        return;
      }

      if (password.length < 8) {
        alert('Password must be at least 8 characters');
        return;
      }

      try {
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          document.getElementById('newUsername').value = '';
          document.getElementById('newPassword').value = '';
          loadUsers();
        } else {
          alert(data.error || 'Failed to add user');
        }
      } catch (error) {
        alert('Failed to add user');
      }
    }

    function openPasswordModal(userId) {
      editingUserId = userId;
      document.getElementById('changePasswordInput').value = '';
      document.getElementById('passwordModal').classList.add('show');
    }

    function closePasswordModal() {
      editingUserId = null;
      document.getElementById('passwordModal').classList.remove('show');
    }

    async function savePassword() {
      const password = document.getElementById('changePasswordInput').value;

      if (password.length < 8) {
        alert('Password must be at least 8 characters');
        return;
      }

      try {
        const response = await fetch(`/api/users/${editingUserId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (response.ok) {
          closePasswordModal();
          loadUsers();
        } else {
          alert(data.error || 'Failed to update password');
        }
      } catch (error) {
        alert('Failed to update password');
      }
    }

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;

      try {
        const response = await fetch(`/api/users/${userId}`, { method: 'DELETE' });
        const data = await response.json();

        if (response.ok) {
          loadUsers();
        } else {
          alert(data.error || 'Failed to delete user');
        }
      } catch (error) {
        alert('Failed to delete user');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (await checkAuth()) {
        const today = new Date().toISOString().split('T')[0];
        const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        
        document.getElementById('endDate').value = today;
        document.getElementById('startDate').value = thirtyDaysAgo;
        
        loadAnalytics();
      }
    });
  </script>
</body>
</html>
